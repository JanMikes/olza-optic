name: Sync opening hours

# The client edits the opening hours herself in the BiteIT micro-content
# admin. This bakes them into the static pages so the published site stays
# crawlable — hourly (matching the CMS's own 1h cache), on every push to
# main so a deploy never ships stale hours, and on demand.

on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-opening-hours
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull hours from the CMS
        run: python3 tools/sync-opening-hours.py

      - name: Commit if the hours changed
        run: |
          if git diff --quiet; then
            echo "Opening hours already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Sync opening hours from CMS [skip ci]"
          git push
